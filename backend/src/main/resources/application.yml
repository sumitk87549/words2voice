spring:
  application:
    name: words2voice-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  sql:
    init:
      mode: always

server:
  error:
    include-stacktrace: never

# ─── Local development profile ────────────────────────────────────────────────
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: "0000"
    driver-class-name: org.postgresql.Driver

supertonic:
  engine:
    base-url: http://127.0.0.1:8000

app:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000
  storage:
    audio-dir: backend-data/audio
  usage:
    daily-limit: 50000
    max-request-chars: 5000
  tts:
    semaphore-permits: 3

# ─── Production profile (Render.com) ─────────────────────────────────────────
# All values come from Render environment variables — nothing is hardcoded.
# Set these in Render dashboard → Environment tab:
#   DATABASE_URL    = jdbc:postgresql://... (from Neon connection string)
#   DB_USERNAME     = your-neon-username
#   DB_PASSWORD     = your-neon-password
#   JWT_SECRET      = a-long-random-secret-string-min-32-chars
#   TTS_ENGINE_URL  = http://YOUR_ORACLE_VM_IP:8000
#   ALLOWED_ORIGINS = https://words2voice.pages.dev,https://https://words2voice.vercel.app/
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

supertonic:
  engine:
    base-url: ${TTS_ENGINE_URL:http://localhost:8000}
    retry-attempts: 3
    retry-delay-ms: 1000

app:
  allowed-origins: ${ALLOWED_ORIGINS:https://words2voice.pages.dev}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  storage:
    audio-dir: /tmp/w2v-audio
  usage:
    daily-limit: 20000
    max-request-chars: 5000
  tts:
    semaphore-permits: 3

# ─── Actuator (both profiles) ─────────────────────────────────────────────────
---
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    defaults:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: Voisetu TTS Backend
    description: Words2Voice API — Text-to-Speech platform
    version: 1.0.0
